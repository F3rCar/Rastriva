[project]
name = "rastriva-backend"
version = "0.1.0"
description = "API inicial do projeto Rastriva"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard-no-fastapi-cloud-cli]",
    "google-genai>=2.25.0",
    "openpyxl>=3.1.5",
    "pandas",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
